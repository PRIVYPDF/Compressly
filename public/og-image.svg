<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0a" />
  <circle cx="950" cy="180" r="300" fill="#18181b" opacity="0.6" />
  <circle cx="200" cy="500" r="240" fill="#18181b" opacity="0.4" />
  
  <!-- Icon container -->
  <rect x="100" y="120" width="80" height="80" rx="20" fill="#ffffff" />
  <path d="M125 150 L140 142 L155 150 L140 158 Z" fill="#0a0a0a" />
  <path d="M125 160 L140 168 L155 160" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M125 170 L140 178 L155 170" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brand text -->
  <text x="200" y="172" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Compressly</text>
  
  <!-- Main Title -->
  <text x="100" y="290" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Compress Images Online</text>
  
  <!-- Subtitle -->
  <text x="100" y="360" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">Reduce JPG, PNG &amp; WebP image size to 20KB, 50KB or 100KB</text>
  <text x="100" y="405" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">100% in-browser processing &bull; Zero server storage</text>

  <!-- Feature Pills -->
  <rect x="100" y="480" width="160" height="52" rx="14" fill="#27272a" />
  <text x="180" y="513" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" text-anchor="middle">20 KB Target</text>

  <rect x="280" y="480" width="160" height="52" rx="14" fill="#27272a" />
  <text x="360" y="513" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" text-anchor="middle">50 KB Target</text>

  <rect x="460" y="480" width="170" height="52" rx="14" fill="#27272a" />
  <text x="545" y="513" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" text-anchor="middle">100 KB Target</text>

  <rect x="650" y="480" width="180" height="52" rx="14" fill="#27272a" />
  <text x="740" y="513" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Custom Size</text>
